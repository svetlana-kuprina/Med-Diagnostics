<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедДиагностика — медицинский центр</title>
    <!-- Bootstrap 5 + иконки -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Дополнительные стили -->
    <style>
        body {
            scroll-behavior: smooth;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        .hero-section {
            background: linear-gradient(145deg, #f0f7ff 0%, #e2eefa 100%);
            padding: 4rem 0 3rem;
            border-bottom: 1px solid rgba(13, 110, 253, 0.1);
        }
        .service-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0, 40, 80, 0.06);
            height: 100%;
        }
        .service-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(13, 110, 253, 0.12);
        }
        .service-icon {
            font-size: 2.8rem;
            color: #0d6efd;
        }
        .section-title {
            position: relative;
            margin-bottom: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .section-title:after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 0;
            width: 70px;
            height: 4px;
            background: #0d6efd;
            border-radius: 4px;
        }
        .section-title.text-center:after {
            left: 50%;
            transform: translateX(-50%);
        }
        .contact-icon {
            font-size: 1.6rem;
            color: #0d6efd;
            min-width: 2.4rem;
        }
        .footer {
            background-color: #0b1a33;
            color: #b6c9e6;
            padding: 2.5rem 0 1.5rem;
        }
        .footer a {
            color: #b6c9e6;
            text-decoration: none;
        }
        .footer a:hover {
            color: white;
            text-decoration: underline;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .navbar-brand i {
            color: #0d6efd;
        }
        .btn-outline-primary {
            border-width: 2px;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.2);
        }
    </style>
</head>
<body>

    {% include 'includes/inc_header.html' %}

    {% block content %}
    {% endblock %}

   {% include 'includes/inc_footer.html' %}
